[package]
name = "piko-win-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = "1"
piko-common-model = { path = "../common-model" }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.49", features = ["net", "rt", "time", "sync", "io-util"] }
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_WinTrust", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_EventLog", "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_JobObjects", "Win32_Security_Isolation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-service = "0.8.1"

[lints]
workspace = true

