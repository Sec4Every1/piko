[package]
name = "piko-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zeroize = "1"
piko-security-core = { version = "0.2.0", path = "../security-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
tokio = { version = "1.49", features = ["net", "io-util", "rt", "time"] }
piko-win-platform = { version = "0.2.0", path = "../win-platform" }
piko-common-model = { version = "0.2.0", path = "../common-model" }
piko-event-schema = { version = "0.2.0", path = "../event-schema" }
piko-event-storage = { version = "0.2.0", path = "../event-storage" }
piko-app-control = { version = "0.2.0", path = "../app-control" }

[lints]
workspace = true

