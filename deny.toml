# Dependency policy, not a statement that an audit has already passed.
# Each new license or advisory exception requires a documented review.
[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
confidence-threshold = 0.95
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016",
    "CC0-1.0", "BSL-1.0", "Unlicense",
]

# Reviewed unchanged Tauri dependencies; exact versions only. See docs/MPL_REVIEW.md.
[[licenses.exceptions]]
name = "cssparser"
version = "=0.37.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "cssparser-macros"
version = "=0.7.1"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "dtoa-short"
version = "=0.3.5"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "option-ext"
version = "=0.2.0"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
name = "selectors"
version = "=0.38.0"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
