[package]
name = "piko-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
piko-event-schema = { path = "../crates/event-schema" }
piko-ipc = { path = "../crates/ipc" }

[[bin]]
name = "event_decoder"
path = "fuzz_targets/event_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_decoder"
path = "fuzz_targets/ipc_decoder.rs"
test = false
doc = false
bench = false

[workspace]

