[workspace]
resolver = "2"
members = [
  "crates/common-model",
  "crates/crypto",
  "crates/event-schema",
  "crates/event-fabric",
  "crates/event-storage",
  "crates/win-platform",
  "crates/win-sensors",
  "crates/ipc",
  "crates/security-core",
  "crates/response-engine",
  "crates/app-control",
  "apps/network-helper",
  "apps/security-service",
  "apps/cli",
]
exclude = ["apps/desktop-ui/src-tauri", "fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"


# Reviewed build-time parser backport; see vendor/i18n-config/PIKO_PATCH.md.
[patch.crates-io]
i18n-config = { path = 'vendor/i18n-config' }
