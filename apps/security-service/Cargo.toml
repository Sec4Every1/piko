[package]
name = "piko-security-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "piko-service"
path = "src/main.rs"

[dependencies]
piko-security-core = { version = "0.2.0", path = "../../crates/security-core" }
piko-response-engine = { version = "0.2.0", path = "../../crates/response-engine" }
piko-common-model = { version = "0.2.0", path = "../../crates/common-model" }
piko-event-schema = { version = "0.2.0", path = "../../crates/event-schema" }
piko-event-storage = { version = "0.2.0", path = "../../crates/event-storage" }
piko-event-fabric = { version = "0.2.0", path = "../../crates/event-fabric" }
piko-win-platform = { version = "0.2.0", path = "../../crates/win-platform" }
piko-win-sensors = { version = "0.2.0", path = "../../crates/win-sensors" }
piko-ipc = { version = "0.2.0", path = "../../crates/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.49", features = ["rt", "macros", "net", "io-util", "time", "signal", "sync"] }

[lints]
workspace = true

