[package]
name = "piko-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
piko-app-control = { version = "0.2.0", path = "../../../crates/app-control" }
piko-security-core = { version = "0.2.0", path = "../../../crates/security-core" }
piko-win-platform = { version = "0.2.0", path = "../../../crates/win-platform" }
tauri = { version = "2", features = [] }
piko-ipc = { version = "0.2.0", path = "../../../crates/ipc" }
piko-common-model = { version = "0.2.0", path = "../../../crates/common-model" }
piko-event-schema = { version = "0.2.0", path = "../../../crates/event-schema" }
piko-event-storage = { version = "0.2.0", path = "../../../crates/event-storage" }

[workspace]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]


[dependencies.serde_json]
version = "1"

[dependencies.serde]
version = "1"
features = ["derive"]
